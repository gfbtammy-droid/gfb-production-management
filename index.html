*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:20;background:var(--brand);color:var(--brand-ink);padding:calc(10px + env(safe-area-inset-top)) 0 10px}
header.top .wrap{display:flex;align-items:center;gap:10px}
header.top h1{font-size:17px;margin:0;font-weight:650;letter-spacing:.2px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live{width:8px;height:8px;border-radius:50%;background:#9be7c4;display:inline-block;margin-right:6px}
.live.off{background:#f3a59f}
.pill-btn{border:1px solid rgba(255,255,255,.4);background:transparent;color:inherit;border-radius:999px;padding:4px 10px;font-size:13px;cursor:pointer}
main{padding:14px 0 calc(90px + env(safe-area-inset-bottom))}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.bottom .wrap{display:flex}
nav.bottom button{flex:1;border:0;background:none;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--muted);cursor:pointer}
nav.bottom button svg{width:22px;height:22px}
nav.bottom button.on{color:var(--brand);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.row{display:flex;gap:8px;align-items:center}
.grow{flex:1;min-width:0}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=search],select,textarea{
  width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
textarea{min-height:70px;resize:vertical}
label.f{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px;font-weight:550}
.btn{border:0;border-radius:10px;padding:11px 16px;min-height:44px;cursor:pointer;font-weight:600;background:var(--brand-soft);color:var(--brand)}
.btn.primary{background:var(--brand);color:var(--brand-ink)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.block{width:100%}
.btn:disabled{opacity:.55;cursor:default}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip b{font-weight:650;margin-left:4px;opacity:.8}
.badge{display:inline-block;font-size:11.5px;font-weight:650;padding:2px 8px;border-radius:999px;white-space:nowrap;letter-spacing:.2px}
.s-PLANNING{background:var(--line);color:var(--ink)}
.s-RELEASED{background:var(--info-soft);color:var(--info)}
.s-IN_PROCESS{background:var(--warn-soft);color:var(--warn)}
.s-DONE{background:var(--violet-soft);color:var(--violet)}
.s-TRANSFERRED{background:var(--brand-soft);color:var(--brand)}
.s-CLOSED{background:var(--ok-soft);color:var(--ok)}
.s-CANCELLED{background:var(--bad-soft);color:var(--bad)}
.flag{background:var(--bad-soft);color:var(--bad)}
.joblist{display:grid;gap:8px}
@media(min-width:760px){.joblist{grid-template-columns:1fr 1fr}}
.job{padding:12px 14px;cursor:pointer;display:block;width:100%;text-align:left}
.job .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.job .no{font-weight:700;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.job .prod{font-weight:650;font-size:15.5px;margin:3px 0 2px}
.job .meta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.muted{color:var(--muted)}
.small{font-size:13px}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:680px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:0 0 calc(16px + env(safe-area-inset-bottom))}
@media(min-width:760px){.sheet-bg{align-items:center}.sheet{border-radius:18px;max-height:88vh}}
.sheet-head{position:sticky;top:0;background:var(--bg);padding:14px 16px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;z-index:2}
.sheet-head h2{margin:0;font-size:17px;flex:1}
.x{border:0;background:var(--card);border-radius:50%;width:36px;height:36px;font-size:20px;cursor:pointer;line-height:1}
.sheet-body{padding:12px 16px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:550;text-align:right;overflow-wrap:anywhere}
.sec{padding:12px 14px;margin-bottom:10px}
.sec h3{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.jo{display:flex;flex-wrap:wrap;gap:6px}
.jo span{font-variant-numeric:tabular-nums;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-size:13px;font-weight:600}
.steps{display:flex;gap:4px;margin:4px 0 2px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--brand)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
@media(min-width:760px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{padding:12px 14px}
.kpi .l{font-size:12.5px;color:var(--muted);font-weight:550}
.kpi .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px;letter-spacing:-.3px}
.kpi .s{font-size:12px;color:var(--muted)}
.bars{display:grid;gap:8px}
.bar .lbl{display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px;gap:8px}
.bar .trk{height:8px;background:var(--line);border-radius:4px;overflow:hidden;position:relative}
.bar .fill{height:100%;background:var(--brand);border-radius:4px}
.trend{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:6px}
.trend .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.trend .pair{display:flex;gap:3px;align-items:flex-end;width:100%;justify-content:center;flex:1}
.trend .pair div{width:40%;max-width:22px;border-radius:4px 4px 0 0}
.trend .p{background:var(--line)}
.trend .a{background:var(--brand)}
.trend .m{font-size:11.5px;color:var(--muted)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{text-align:left;color:var(--muted);font-weight:550;font-size:12px;padding:6px 6px;border-bottom:1px solid var(--line)}
table.t td{padding:8px 6px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
table.t td.n,table.t th.n{text-align:right}
.scroll-x{overflow-x:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:60;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast.err{background:var(--bad);color:#fff}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.login .card{width:100%;max-width:380px;padding:24px}
.logo{width:52px;height:52px;border-radius:14px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;margin-bottom:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:6px 12px;cursor:pointer;font-size:13px}
.seg button.on{background:var(--brand);color:var(--brand-ink);font-weight:600}
.actions{display:grid;gap:8px;margin-top:4px}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:13.5px;margin:8px 0}
.errbox{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:10px 12px;font-size:13.5px;margin:8px 0}
.hist{font-size:13px;border-left:2px solid var(--line);padding-left:10px;display:grid;gap:8px}
.hist b{font-weight:600}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:25;background:var(--brand);color:var(--brand-ink);border:0;border-radius:16px;height:52px;padding:0 18px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.2);cursor:pointer;display:flex;align-items:center;gap:6px}
.listitem{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.listitem:last-child{border-bottom:0}
.check{display:flex;align-items:center;gap:10px;margin:12px 0;font-size:14px}
.check input{width:20px;height:20px}

  .sheet-bg{align-items:stretch;justify-content:flex-end}

.jcell .rm{border:0;background:none;color:var(--muted);font-size:18px;cursor:pointer;padding:0 4px}
.jtools{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.jtools .btn{min-height:36px;padding:6px 12px;font-size:13px}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-top:10px}
.bcell{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.bcell .lab{font-size:12.5px;font-weight:650;display:flex;justify-content:space-between;gap:6px}
.bcell .lab span{color:var(--muted);font-weight:500}
.bcell input{margin-top:6px;min-height:38px;padding:6px 10px}
.bcell.filled{border-color:var(--brand);background:var(--brand-soft)}
details.guide{margin-bottom:8px;padding:0}
details.guide summary{cursor:pointer;padding:14px 16px;font-weight:650;font-size:15.5px;list-style:none;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
details.guide summary::-webkit-details-marker{display:none}
details.guide summary::before{content:"›";display:inline-block;transition:transform .15s;color:var(--muted);font-size:20px;line-height:1;width:12px}
details.guide[open] summary::before{transform:rotate(90deg)}
details.guide .gbody{padding:0 16px 14px 36px;font-size:14.5px}
details.guide .gbody p{margin:8px 0}
details.guide .gbody ul,details.guide .gbody ol{margin:6px 0;padding-left:20px}
details.guide .gbody li{margin:4px 0}
.steps-g{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.print-only{display:none}
@media print{
  header.top,nav.bottom,.no-print,.fab{display:none!important}
  .print-only{display:block}
  main{padding:0!important}
  body{background:#fff;color:#000}
  .card{box-shadow:none;border-color:#ccc;break-inside:avoid}
}
</style>

async function loadAll(){
  const [jobsR, mR, sR, lR, bR, pR] = await Promise.all([
    fetchAllJobs(),
    sb.from("machines").select("*").order("sort_order"),
    sb.from("app_settings").select("*"),
    sb.from("loss_reports").select("*").order("occurred_at",{ascending:false}).limit(5000),
    sb.from("job_batches").select("*").order("id",{ascending:false}).range(0, 19999),
    sb.from("role_permissions").select("*")
  ]);
  S.perms = {}; (pR.data||[]).forEach(x=>{ if(x.allowed) S.perms[x.role+"|"+x.task]=true; });
  S.batches = bR.data || [];
  S.jobs = jobsR;
  S.losses = lR.data || [];
  S.machines = mR.data || [];
  const tg = (sR.data||[]).find(x=>x.key==="wastage_target_pct"); if(tg) S.target = Number(tg.value);
}
async function fetchAllJobs(){
  let all=[], from=0; const size=1000;
  while(true){
    const { data, error } = await sb.from("job_orders").select("*").order("id",{ascending:false}).range(from, from+size-1);
    if(error) throw error;
    all = all.concat(data); if(data.length < size) break; from += size;
  }
  return all;
}
function upsertLocal(row){
  const i = S.jobs.findIndex(j=>j.id===row.id);
  if(i>=0) S.jobs[i]=row; else S.jobs.unshift(row);
}
let channel;
function subscribe(){
  if(channel) sb.removeChannel(channel);
  channel = sb.channel("jobs-live")
    .on("postgres_changes",{event:"*",schema:"public",table:"job_orders"}, p => {
      if(p.eventType==="DELETE"){ S.jobs = S.jobs.filter(j=>j.id!==p.old.id); }
      else upsertLocal(p.new);
      if(!$(".sheet-bg") || S.tab!=="jobs") render(); else renderMainOnly();
      const open = $(".sheet[data-job]"); if(open && p.new && Number(open.dataset.job)===p.new.id) openJob(p.new.id, true);
    })
    .on("postgres_changes",{event:"*",schema:"public",table:"job_batches"}, p => {
      if(p.eventType==="DELETE") S.batches = S.batches.filter(b=>b.id!==p.old.id);
      else { const i=S.batches.findIndex(b=>b.id===p.new.id); if(i>=0) S.batches[i]=p.new; else S.batches.push(p.new); }
      const open = $(".sheet[data-job]"); if(open && p.new && Number(open.dataset.job)===p.new.job_id && !$("#fs") && !$("#jf")) openJob(p.new.job_id, true);
    })
    .on("postgres_changes",{event:"*",schema:"public",table:"loss_reports"}, p => {
      if(p.eventType==="DELETE") S.losses = S.losses.filter(l=>l.id!==p.old.id);
      else { const i=S.losses.findIndex(l=>l.id===p.new.id); if(i>=0) S.losses[i]=p.new; else S.losses.unshift(p.new); }
      if(!$(".sheet-bg")) renderMainOnly();
    })
    .subscribe(st => { S.live = (st==="SUBSCRIBED"); const d=$(".live"); if(d) d.classList.toggle("off", !S.live); });
}
async function updateJob(id, patch){
  const { data, error } = await sb.from("job_orders").update(patch).eq("id", id).select().single();
  if(error) throw error;
  upsertLocal(data); return data;
}

async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ renderLogin(); return; }
  S.user = session.user;
  const { data:me } = await sb.from("app_users").select("*").eq("user_id", S.user.id).maybeSingle();
  if(!me || !me.active){ await sb.auth.signOut(); renderLogin(t("noAccess")); return; }
  S.me = me;
  $("#app").innerHTML = `<div class="empty">${t("loading")}</div>`;
  try { await loadAll(); } catch(e){ toast(errMsg(e), true); }
  subscribe();
  render();
}
sb.auth.onAuthStateChange((ev) => { if(ev==="SIGNED_OUT"){ S.me=null; renderLogin(); } });

function filteredJobs(){
  const q = S.q.trim().toLowerCase();
  return S.jobs.filter(j => {
    if(S.filter==="ACTIVE" && ["CLOSED","CANCELLED"].includes(j.status)) return false;
    if(S.filter!=="ACTIVE" && S.filter!=="ALL" && j.status!==S.filter) return false;
    if(S.machineF && j.machine!==S.machineF) return false;
    if(q){
      const hay = [j.job_no,j.item_code,j.product,j.customer,j.machine,j.notes,j.remarks,j.to_req_no,...(j.jo_mix||[]).map(x=>JO(x)+" b/n "+x+" bn"+x),...(j.jo_pack||[]).map(JO)].join(" ").toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}
function renderJobs(m){
  const counts = {}; S.jobs.forEach(j=>counts[j.status]=(counts[j.status]||0)+1);
  const activeN = S.jobs.filter(j=>!["CLOSED","CANCELLED"].includes(j.status)).length;
  const list = filteredJobs();
  const chips = [["ACTIVE",t("active"),activeN], ...STATUSES.map(s=>[s,t(s),counts[s]||0]), ["ALL",t("all"),S.jobs.length]];
  const machines = [...new Set(S.jobs.map(j=>j.machine))].sort();
  const desk = isDesk();
  const shown = desk ? sortJobs(list).slice(0, S.limit*4) : list.slice(0,S.limit);
  const lim = desk ? S.limit*4 : S.limit;
  m.innerHTML = `
   <div class="toolbar">
     <input type="search" id="q" placeholder="${esc(t("search"))}" value="${esc(S.q)}">
     <select id="mf"><option value="">${t("machine")}: ${t("all")}</option>${machines.map(x=>`<option ${S.machineF===x?"selected":""}>${esc(x)}</option>`).join("")}</select>
     ${desk?`<button class="btn ghost" id="csv2">${t("exportCsv")}</button>`:""}
     ${desk && perm("job_create")?`<button class="btn primary" id="newJ">+ ${t("newJob")}</button>`:""}
   </div>
   <div class="chips">${chips.map(([k,l,n])=>`<button class="chip ${S.filter===k?"on":""}" data-f="${esc(k)}">${esc(l)}<b>${n}</b></button>`).join("")}</div>
   ${desk ? jobTable(shown) : `<div class="joblist">${shown.map(jobCard).join("") || `<div class="empty">${t("noData")}</div>`}</div>`}
   ${list.length>lim?`<div style="text-align:center;margin:14px 0"><div class="muted small" style="margin-bottom:6px">${t("showing")} ${lim} ${t("of")} ${list.length}</div><button class="btn ghost" id="moreJobs">${t("moreBtn")}</button></div>`:""}`;
  const q=$("#q"); q.oninput = () => { S.q=q.value; S.limit=60; const pos=q.selectionStart; renderJobs(m); const nq=$("#q"); nq.focus(); nq.setSelectionRange(pos,pos); };
  $("#mf").onchange = e => { S.machineF=e.target.value; renderJobs(m); };
  m.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{S.filter=c.dataset.f; S.limit=60; renderJobs(m);});
  m.querySelectorAll(".job,tr[data-id]").forEach(c=>c.onclick=()=>openJob(Number(c.dataset.id)));
  m.querySelectorAll("th[data-sort]").forEach(th=>th.onclick=()=>{ const k=th.dataset.sort; S.sortDir = S.sortKey===k ? -S.sortDir : 1; S.sortKey=k; renderJobs(m); });
  if($("#moreJobs")) $("#moreJobs").onclick=()=>{S.limit+=60; renderJobs(m);};

const isDesk = () => window.matchMedia("(min-width:900px)").matches;
const COLS = [
  ["job_no","c_project"],["plan_date","c_plan"],["date_released","c_rel"],["date_done","c_done"],["machine","c_machine"],["product","c_product"],["notes","c_remark"],
  ["total_planned","c_total",1],["jo","c_jo"],["mixing_output","c_mix",1],["packing_output","c_pack",1],["var","c_var",1]
];
function sortVal(j,k){
  if(k==="job_no") return j.id; if(k==="var") return varPct(j) ?? -999; if(k==="status") return STEP[j.status];
  if(k==="jo") return Number((j.jo_mix||[])[0]||0);
  if(["batches","total_planned","mixing_output","packing_output"].includes(k)) return j[k]==null ? -1 : Number(j[k]);
  return String(j[k] ?? "");
}

function sortJobs(list){
  const k=S.sortKey, d=S.sortDir;
  return [...list].sort((a,b)=>{ const x=sortVal(a,k), y=sortVal(b,k); return (x>y?1:x<y?-1:0)*d || (b.id-a.id); });
}

function formSheet(title, fields, onSave){
  const html = fields.map(f => {
    if(f.type==="select") return `<label class="f">${f.label}</label><select id="f_${f.k}">${f.opts.map(o=>`<option value="${esc(o[0])}" ${String(f.v??"")===String(o[0])?"selected":""}>${esc(o[1])}</option>`).join("")}</select>`;
    if(f.type==="textarea") return `<label class="f">${f.label}</label><textarea id="f_${f.k}">${esc(f.v??"")}</textarea>`;
    return `<label class="f">${f.label}</label><input type="${f.type||"text"}" id="f_${f.k}" value="${esc(f.v??"")}" ${f.step?`step="${f.step}" inputmode="decimal"`:""} ${f.req?"required":""}>`;
  }).join("");
  const bg = sheet(title, `<form id="fs">${html}<div id="ferr"></div><div class="grid2" style="margin-top:16px"><button type="button" class="btn ghost" id="fc">${t("cancel")}</button><button class="btn primary" id="fsb">${t("save")}</button></div></form>`);
  $("#fc").onclick = closeSheet;
  $("#fs").onsubmit = async e => {
    e.preventDefault(); const vals = {}; fields.forEach(f => { vals[f.k] = $("#f_"+f.k).value; });
    $("#fsb").disabled = true;
    try { await onSave(vals); }
    catch(er){ $("#ferr").innerHTML = `<div class="errbox">${esc(errMsg(er))}</div>`; $("#fsb").disabled=false; }
  };
  return bg;
}
const numOrNull = v => v===""||v==null ? null : Number(String(v).replace(/,/g,""));

async function doAction(j, act){
  const done = async (patch) => { await updateJob(j.id, patch); toast(t("saved")); openJob(j.id); renderMainOnly(); };
  try {
    switch(act){
      case "release": return await done({ status:"RELEASED", date_released: j.date_released || today() });
      case "unrelease": return await done({ status:"PLANNING" });
      case "start": return formSheet(t("actStart"), [{k:"d",label:t("date"),type:"date",v:today(),req:true}], v => done({status:"IN PROCESS", date_mixing:v.d}));
      case "mix": {
        const bts = batchesOf(j.id);
        if(!bts.length) return formSheet(t("actMix"), [
          {k:"d",label:t("date"),type:"date",v:j.date_mixing||today(),req:true},
          {k:"o",label:t("mixOut")+" (KG)",type:"number",step:"0.01",v:j.mixing_output??"",req:true}],
          v => done({date_mixing:v.d, mixing_output:numOrNull(v.o)}));
        return batchForm(j, bts);
      }
      case "pack": return packForm(j, done);
      case "adminedit": return adminEditForm(j);
      case "editproduct": {
        const products = [...new Set(S.jobs.map(x=>x.product))].sort();
        const bg = formSheet(`${t("editProduct")} · ${esc(j.job_no)}`, [{k:"p",label:t("product"),v:j.product,req:true}], v => done({ product: v.p.trim().toUpperCase() }));

        if(!j.bulk_packing && j.packing_output==null){ toast(t("actPack"), true); return doAction(j,"pack"); }
        return await done({status:"DONE"});
      }
      case "reopen": return await done({status:"IN PROCESS"});
      case "transfer": return formSheet(t("actTransfer"), [
          {k:"r",label:t("toReq"),v:j.to_req_no||"",req:true},
          {k:"d",label:t("date"),type:"date",v:j.date_transferred||today(),req:true}],

          {k:"r",label:t("qcResult"),type:"select",v:j.qc_result||"PASS",opts:[["PASS","PASS"],["HOLD","HOLD"],["FAIL","FAIL"]]},
          {k:"d",label:t("date"),type:"date",v:j.date_qc||today(),req:true},
          {k:"m",label:t("remarks"),type:"textarea",v:j.remarks||""}],
          v => done({qc_result:v.r, date_qc:v.d, remarks:v.m.trim()||null}));
      case "waste": return formSheet(t("actWaste"), [
          {k:"c",label:t("cause"),type:"textarea",v:j.wastage_cause||"",req:true},
          {k:"a",label:t("action"),type:"textarea",v:j.wastage_action||""}],
          v => { if(!v.c.trim()) throw new Error(t("cause")); return done({wastage_cause:v.c.trim(), wastage_action:v.a.trim()||null}); });
      case "verify": return formSheet(t("actVerify"), [
          {k:"b",label:t("verifiedBy"),v:S.me.full_name,req:true},
          {k:"d",label:t("verifiedDate"),type:"date",v:today(),req:true}],
          v => done({wastage_verified_by:v.b.trim(), wastage_verified_date:v.d}));
      case "close": {
        if(overTarget(j) && !j.wastage_cause){ toast(t("overTarget"), true); return doAction(j,"waste"); }
        return await done({status:"CLOSED", date_closed: today()});
      }
      case "cancel": if(confirmSheet(t("confirmCancel"), ()=>done({status:"CANCELLED"}))) return; return;
      case "edit": return openJobForm(j);
      case "reportloss": return openLossForm(null, j.id);
    }
  } catch(e){ toast(errMsg(e), true); }
}

function joEditor(el, initial, countEl, targetN){
  let list = initial.length ? [...initial] : [""];
  const markDup = () => { const c={}; list.forEach(v=>{ if(v) c[v]=(c[v]||0)+1; });
    el.querySelectorAll("input[data-i]").forEach(inp=>{ const v=list[Number(inp.dataset.i)]; inp.closest(".jcell").classList.toggle("dup", !!v && c[v]>1); }); };
  const draw = () => {
    const counts = {}; list.forEach(v=>{ if(v) counts[v]=(counts[v]||0)+1; });
    el.innerHTML = `<div class="jgrid">${list.map((v,i)=>`<div class="jcell ${v&&counts[v]>1?"dup":""}"><span class="n">${i+1}</span><input inputmode="numeric" data-i="${i}" value="${esc(v)}" placeholder="JOB"><button type="button" class="rm" data-rm="${i}" aria-label="remove">×</button></div>`).join("")}</div>
      <div class="jtools"><button type="button" class="btn ghost" data-add>${t("joAdd")}</button><button type="button" class="btn ghost" data-fill>${t("joFill")}</button></div>`;
    if(countEl) countEl.textContent = `(${list.filter(Boolean).length})`;
    el.querySelectorAll("input[data-i]").forEach(inp => {
      inp.oninput = () => { list[Number(inp.dataset.i)] = inp.value.trim(); if(countEl) countEl.textContent = `(${list.filter(Boolean).length})`; };
      inp.onchange = markDup;
      inp.onkeydown = e => { if(e.key==="Enter"){ e.preventDefault(); const nx = el.querySelector(`input[data-i="${Number(inp.dataset.i)+1}"]`); if(nx) nx.focus(); else { list.push(""); draw(); el.querySelector(`input[data-i="${list.length-1}"]`).focus(); } } };
    });
    el.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { list.splice(Number(b.dataset.rm),1); if(!list.length) list=[""]; draw(); });
    el.querySelector("[data-add]").onclick = () => { list.push(""); draw(); el.querySelector(`input[data-i="${list.length-1}"]`).focus(); };
    el.querySelector("[data-fill]").onclick = () => {
      const first = list.find(v=>/^\d+$/.test(v)); if(!first) return;
      const n = Math.max(targetN()||0, list.length, 1); const start = Number(first);
      list = Array.from({length:n}, (_,k)=>String(start+k)); draw();
    };
  };
  draw();
  return { values: () => list.map(v=>v.trim()).filter(Boolean),
           hasDup: () => { const v = list.map(x=>x.trim()).filter(Boolean); return new Set(v).size !== v.length; } };
}

        row.status = $("#j_rel") && $("#j_rel").checked ? "RELEASED" : "PLANNING";
        const { data, error } = await sb.from("job_orders").insert(row).select().single();
        if(error) throw error;
        upsertLocal(data); await refreshBatches(data.id);
        toast(`${t("jobCreated")}: ${data.job_no}`);
        openJob(data.id);
      }
      renderMainOnly();
    } catch(er){ $("#jerr").innerHTML = `<div class="errbox">${esc(errMsg(er))}</div>`; $("#js").disabled=false; }
  };
}

function monthsAvailable(){
  const set = new Set(); S.jobs.forEach(j=>{ if(j.plan_date) set.add(ym(j.plan_date)); const od=outputDate(j); if(od) set.add(ym(od)); });
  set.add(today().slice(0,7));
  return [...set].sort().reverse();
}
const monLabel = m => { const [y,mm]=m.split("-"); return `${mon(Number(mm)-1)} ${y}`; };
function monthStats(m){
  const plannedJobs = S.jobs.filter(j=>ym(j.plan_date)===m && j.status!=="CANCELLED");
  const planned = plannedJobs.reduce((a,j)=>a+Number(j.total_planned||0),0);
  const outJobs = S.jobs.filter(j=>outputOf(j)!=null && ym(outputDate(j))===m);
  const out = outJobs.reduce((a,j)=>a+outputOf(j),0);
  const wj = outJobs.filter(j=>j.mixing_output>0 && j.packing_output!=null);
  const mixSum = wj.reduce((a,j)=>a+Number(j.mixing_output),0);
  const varSum = wj.reduce((a,j)=>a+Number(j.mixing_output-j.packing_output),0);
  return { plannedJobs, planned, outJobs, out, ach: planned? out/planned : null, waste: mixSum? varSum/mixSum : null };
}

function lossSummary(packedJobs){
  const lm = S.losses.filter(l=>toMY(l.occurred_at).slice(0,7)===S.month);
  if(!lm.length) return "";
  const tot = lm.reduce((a,l)=>a+Number(l.qty_kg),0);
  const group = key => { const o={}; lm.forEach(l=>{ o[l[key]]=(o[l[key]]||0)+Number(l.qty_kg); }); return Object.entries(o).sort((a,b)=>b[1]-a[1]); };
  const bt = group("loss_type"), bs = group("stage"); const mx = Math.max(1, ...bt.map(x=>x[1]), ...bs.map(x=>x[1]));
  const pos = packedJobs.reduce((a,j)=>a+Math.max(j.mixing_output-j.packing_output,0),0);
  const expl = packedJobs.reduce((a,j)=>a+Math.min(Math.max(j.mixing_output-j.packing_output,0), jobLoss(j.id)),0);
  const bars = rows => rows.map(([k,v])=>`<div class="bar"><div class="lbl"><span>${esc(t(k))}</span><span class="muted">${nf(v, v%1?2:0)} KG</span></div><div class="trk"><div class="fill" style="width:${v/mx*100}%;background:var(--warn)"></div></div></div>`).join("");
  return `<div class="card sec"><div class="row" style="justify-content:space-between;flex-wrap:wrap;gap:6px"><h3 style="margin:0">${t("lossMonth")}: ${nf(tot, tot%1?2:0)} KG (${lm.length})</h3>
     ${pos?`<span class="small">${t("explained")}: <b>${nf(expl,1)}</b> / ${nf(pos,1)} KG (${pct(expl/pos,0)})</span>`:""}</div>
     <div class="grid2" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin-top:10px">
       <div><div class="muted small" style="margin-bottom:6px">${t("lossByType")}</div><div class="bars">${bars(bt)}</div></div>
       <div><div class="muted small" style="margin-bottom:6px">${t("lossByStage")}</div><div class="bars">${bars(bs)}</div></div>
     </div></div>`;
}

    const ph = $("#ph"); if(ph) ph.innerHTML = (data||[]).map(d=>d.signedUrl?`<a href="${d.signedUrl}" target="_blank" rel="noopener"><img src="${d.signedUrl}" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;border:1px solid var(--line)"></a>`:"").join("");

function upsertLoss(row){ const i=S.losses.findIndex(x=>x.id===row.id); if(i>=0) S.losses[i]=row; else S.losses.unshift(row); }

async function compressImage(file){
  try{
    const bmp = await createImageBitmap(file);
    const scale = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width*scale); c.height = Math.round(bmp.height*scale);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise(r => c.toBlob(b => r(b || file), "image/jpeg", 0.8));
  } catch(e){ return file; }
}

function openLossForm(l, jobId){
  const isEdit = !!l;
  const preJob = isEdit ? l.job_id : (jobId || null);
  const pj = S.jobs.find(x=>x.id===preJob);
  const jobs = S.jobs.filter(j=>!["CLOSED","CANCELLED"].includes(j.status) || j.id===preJob).slice(0,300);
  const nowLocal = toMY(isEdit ? l.occurred_at : new Date().toISOString()).slice(0,16);
  const body = `<form id="lf2">
    <label class="f">Job</label><select id="l_job"><option value="">${t("noJob")}</option>${jobs.map(j=>`<option value="${j.id}" ${j.id===preJob?"selected":""}>${esc(j.job_no)} · ${esc(j.product)} · ${esc(j.customer||"")}</option>`).join("")}</select>
    <label class="f">${t("bn")}</label><select id="l_bn"></select>
    <div class="grid2">
      <div><label class="f">${t("stage")}</label><select id="l_stage">${LSTAGES.map(s=>`<option value="${s}" ${(isEdit?l.stage:(pj&&pj.status==="IN PROCESS"&&pj.mixing_output!=null?"PACKING":"MIXING"))===s?"selected":""}>${t(s)}</option>`).join("")}</select></div>
      <div><label class="f">${t("lossType")}</label><select id="l_type">${LTYPES.map(s=>`<option value="${s}" ${isEdit&&l.loss_type===s?"selected":""}>${t(s)}</option>`).join("")}</select></div>
    </div>
    <label class="f">${t("material")}</label><input type="text" id="l_mat" value="${esc(isEdit?l.material:(pj?.product||""))}" required>
    <div class="grid2">
      <div><label class="f">${t("qtyLost")}</label><input type="number" id="l_qty" step="0.01" min="0.01" inputmode="decimal" value="${isEdit?l.qty_kg:""}" required></div>
      <div><label class="f">${t("occurred")}</label><input type="datetime-local" id="l_time" value="${nowLocal}" required></div>
    </div>
    <label class="f">${t("whatHappened")}</label><textarea id="l_desc" required>${esc(isEdit?l.description:"")}</textarea>
    <label class="f">${t("immAction")}</label><textarea id="l_act">${esc(isEdit?(l.immediate_action||""):"")}</textarea>
    <label class="f">${t("photos")} ${isEdit&&l.photo_paths?.length?`<span class="muted">(${l.photo_paths.length} ✓)</span>`:""}</label>
    <input type="file" id="l_ph" accept="image/*" capture="environment" multiple style="min-height:auto;padding:8px">
    <div class="muted small" id="l_phn" style="margin-top:4px"></div>
    <div id="lerr"></div>
    <div class="grid2" style="margin-top:14px"><button type="button" class="btn ghost" id="lc">${t("cancel")}</button><button class="btn primary" id="ls">${t("save")}</button></div>
  </form>`;
  sheet(isEdit ? `${t("editReport")} · ${esc(l.report_no)}` : t("reportLoss"), body);
  const fillBn = () => { const j=S.jobs.find(x=>x.id===Number($("#l_job").value)); const cur = isEdit ? l.batch_no : null;
    $("#l_bn").innerHTML = `<option value="">${t("batchOpt")}</option>` + (j?(j.jo_mix||[]):[]).map(x=>`<option value="${esc(x)}" ${cur===x?"selected":""}>${t("bn")} ${esc(x)} (${esc(JO(x))})</option>`).join(""); };
  fillBn();
  $("#l_job").onchange = e => { const j=S.jobs.find(x=>x.id===Number(e.target.value)); if(j && !$("#l_mat").value) $("#l_mat").value=j.product; fillBn(); };
  $("#l_ph").onchange = e => { $("#l_phn").textContent = e.target.files.length ? `${e.target.files.length} 📷` : ""; };
  $("#lc").onclick = () => isEdit ? openLoss(l.id) : closeSheet();
  $("#lf2").onsubmit = async e => {
    e.preventDefault(); $("#ls").disabled = true;
    try{
      const files = [...$("#l_ph").files].slice(0,6);
      const paths = isEdit ? [...(l.photo_paths||[])] : [];
      if(files.length){
        $("#l_phn").textContent = t("uploading");
        for(const f of files){
          const blob = await compressImage(f);
          const path = `${S.me.user_id}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.jpg`;
          const { error } = await sb.storage.from("loss-photos").upload(path, blob, { contentType: blob.type || "image/jpeg" });
          if(error) throw error; paths.push(path);
        }
      }
      const row = {
        job_id: $("#l_job").value ? Number($("#l_job").value) : null, batch_no: $("#l_bn").value || null,
        stage: $("#l_stage").value, loss_type: $("#l_type").value,
        material: $("#l_mat").value.trim().toUpperCase(), qty_kg: Number($("#l_qty").value),
        occurred_at: new Date($("#l_time").value + ":00+08:00").toISOString(),
        description: $("#l_desc").value.trim(), immediate_action: $("#l_act").value.trim() || null, photo_paths: paths
      };
      const q = isEdit ? sb.from("loss_reports").update(row).eq("id", l.id) : sb.from("loss_reports").insert(row);
      const { data, error } = await q.select().single(); if(error) throw error;
      upsertLoss(data); toast(`${t("saved")}: ${data.report_no}`); openLoss(data.id); renderMainOnly();
    } catch(er){ $("#lerr").innerHTML = `<div class="errbox">${esc(errMsg(er))}</div>`; $("#ls").disabled=false; $("#l_phn").textContent=""; }
  };
}
function exportLossCsv(list){
  const cols = ["report_no","occurred_at","job_no","batch_no","stage","loss_type","material","qty_kg","description","immediate_action","reporter_name","disposition","corrective_action","disposition_name","disposition_at","status","photos"];
  const rows = [...list].sort((a,b)=>a.id-b.id).map(l=>{ const j=S.jobs.find(x=>x.id===l.job_id);
    const o = {...l, occurred_at: fdt(l.occurred_at), disposition_at: l.disposition_at?fdt(l.disposition_at):"", job_no: j?j.job_no:"", photos:(l.photo_paths||[]).length, stage:t(l.stage), loss_type:t(l.loss_type), disposition:l.disposition?t(l.disposition):""};
    return cols.map(c=>{ let v=o[c]??""; v=String(v); return /[",\n]/.test(v)?`"${v.replace(/"/g,'""')}"`:v; }).join(","); });
  const blob = new Blob(["﻿"+cols.join(",")+"\n"+rows.join("\n")], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `GFB_Loss_Reports_${today()}.csv`; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}

   <li>When sent to store, press <b>Transfer to store (TO)</b> and enter the TO REQ No.</li></ol>
   <p>If the variance is above target, press <b>Enter wastage cause</b> and write the cause and action. Entered something wrong? Press <b>Reopen</b> while the job is Done.</p>`},
  {id:"qc", roles:["supervisor","operation","admin"], h:"6. QC result and wastage verification", b:`
   <ul><li>Open the job and press <b>Record QC result</b>: PASS, HOLD or FAIL, with date and remarks.</li>
   <li><b>HOLD or FAIL blocks the transfer to store</b> until the result is changed to PASS.</li>
   <li>For jobs over the wastage target that already have a cause, press <b>Verify wastage</b>.</li></ul>`},
  {id:"waste", roles:["all"], h:"7. Wastage: how it is calculated", b:`
   <ul><li><b>Variance (KG)</b> = mixing output − packing output. Calculated automatically.</li>
   <li><b>Variance %</b> = variance ÷ mixing output.</li>
   <li><b>Monthly wastage rate</b> = total variance ÷ total mixing output for jobs packed in that month.</li>
   <li><b>Reported losses</b> (spillage, torn bags and so on) at the mixing or packing stage are deducted from that job's variance. What remains is the <b>unexplained variance</b>.</li>
   <li>Only unexplained variance above the target (default 1.0%) is flagged <b>Needs cause</b> and blocks closing the job.</li>
   <li>Grades: Acceptable ≤ target · Monitor ≤ 2× · Action Required ≤ 5× · Critical &gt; 5×.</li>
   <li>Bulk packing and repack jobs are left out of the wastage rate because there are not two outputs to compare.</li></ul>`},
  {id:"loss", roles:["all"], h:"8. Production Loss Reports", b:`
   <ol><li>Press <b>+ Report Loss</b> on the Losses screen, or from inside a job (the ⚠ Report Loss button).</li>
   <li>Choose the job (or "No job" for raw material in the store), the stage and the type of loss.</li>
   <li>Enter the material, KG lost, time, what happened and the immediate action.</li>
   <li>Take <b>photos</b> straight from the phone camera (up to 6).</li>
   <li>Save. A LOSS-xxxx number is issued automatically.</li></ol>
   <p>The <b>disposition</b> (Dispose / Rework / Quarantine / Return to stock) is signed off by a <b>production supervisor, operation or admin</b> only. A report cannot be closed without one, and is locked once closed.</p>
   <p class="muted small">Injuries to staff go in the DOSH incident register (CMMS), not here.</p>`},
  {id:"dash", roles:["all"], h:"9. Dashboard", b:`
   <ul><li><b>Planned</b>: total KG of jobs by plan date in the selected month.</li>
   <li><b>Output</b>: KG packed, by actual packing date (bulk jobs: mixing output).</li>
   <li><b>Achievement</b> = Output ÷ Planned.</li>
   <li>Click any status under <b>Live Operations</b> to jump to that job list.</li></ul>`},
  {id:"admin", roles:["admin"], h:"10. Admin: users and settings", b:`
   <ul><li><b>Add a user</b>: More → Users → + Add User. Enter the name, username, role and a temporary password (at least 8 characters). Give the details to the staff member.</li>
   <li><b>Forgotten password</b>: open that user and enter a new password.</li>
   <li><b>Staff who leave</b>: switch them to OFF. Their history is kept.</li>
   <li><b>Wastage target</b> and the <b>machine</b> list can be changed under More → Settings.</li>
   <li><b>Download CSV</b> for jobs and loss reports (opens in Excel).</li>
   <li><b>Edit (Admin)</b> inside every job: correct any field, including old jobs, JOB numbers, outputs and status. All changes are recorded in History.</li></ul>`},
  {id:"faq", roles:["all"], h:"11. FAQ", b:`
   <p><b>Red message "cannot change…"</b>: your role is not allowed to do that step. Ask the right person or the admin.</p>
   <p><b>Data not showing</b>: check the green dot at the top, then refresh the page.</p>
   <p><b>Wrong output entered</b>: a supervisor can re-record outputs until the job is Transferred. After that, ask the admin.</p>
   <p><b>Every change is recorded</b> in each job's History, with the name and time.</p>`}
 ]
};
function renderGuide(m){
  const role = S.me.role;
  const secs = GUIDE[LANG] || GUIDE.en;
  m.innerHTML = `
   <div class="toolbar no-print"><button class="btn ghost" id="gBack">‹ ${t("more")}</button><h2 class="pg grow" style="margin:0">${t("guide")}</h2>
     <button class="btn ghost desk-only" id="gAll">${t("expandAll")}</button><button class="btn desk-only" id="gPrint">${t("print")}</button></div>
   <h2 class="print-only">${t("appName")} · ${t("guide")}</h2>
   <div class="muted small no-print" style="margin-bottom:10px">${t("guideIntro")} <b>${t(role)}</b>.</div>
   ${secs.map(s=>{ const mine = s.roles.includes(role) && s.roles[0]!=="all" || ["start"].includes(s.id);
     return `<details class="card guide" ${mine?"open":""}><summary>${esc(s.h)}${s.roles[0]!=="all"?` <span class="badge ${s.roles.includes(role)?"s-TRANSFERRED":"s-PLANNING"}">${s.roles.filter(r=>r!=="admin").map(r=>t(r)).join(", ")||t("admin")}</span>`:""}</summary><div class="gbody">${s.b}</div></details>`; }).join("")}
   <div class="muted small" style="text-align:center;margin:18px 0">GFB Food Sdn Bhd · ${t("appName")}</div>`;
  $("#gBack").onclick = () => { S.tab="more"; render(); };
  $("#gAll").onclick = () => { const d=[...m.querySelectorAll("details")]; const open=!d.every(x=>x.open); d.forEach(x=>x.open=open); };
  $("#gPrint").onclick = () => { m.querySelectorAll("details").forEach(x=>x.open=true); window.print(); };
}

// ======================= MORE =======================
async function renderMore(m){
  const isA = can("admin");
  m.innerHTML = `
   <h2 class="pg">${t("more")}</h2>
   <div class="card sec"><div class="muted small">${t("loggedAs")}</div><div style="font-weight:650;font-size:16px">${esc(S.me.full_name)}</div>
     <div class="muted small">@${esc(S.me.username)} · ${t(S.me.role)}</div></div>
   <div class="card" style="margin-bottom:10px">
     <div class="listitem"><span class="grow">${t("language")}</span><div class="seg"><button data-l="ms" class="${LANG==="ms"?"on":""}">Bahasa Malaysia</button><button data-l="en" class="${LANG==="en"?"on":""}">English</button></div></div>
     <div class="listitem" style="cursor:pointer" id="guideL"><span class="grow">📘 ${t("guide")}</span><span class="muted">›</span></div>
     <div class="listitem" style="cursor:pointer" id="csv"><span class="grow">${t("exportCsv")}</span><span class="muted">›</span></div>
     <div class="listitem" style="cursor:pointer" id="cpw"><span class="grow">${t("changePw")}</span><span class="muted">›</span></div>
     <div class="listitem" style="cursor:pointer;color:var(--bad)" id="lo"><span class="grow">${t("logout")}</span></div>
   </div>
   ${isA?`
   <div class="row" style="margin:16px 0 8px"><h3 class="grow" style="margin:0;font-size:16px">${t("users")}</h3><button class="btn" id="addU">+ ${t("addUser")}</button></div>
   <div class="card" id="ulist"><div class="listitem muted">${t("loading")}</div></div>
   <div class="muted small" style="margin:6px 2px 0">${t("roleHelp")}</div>
   <h3 style="margin:18px 0 8px;font-size:16px">${t("access")}</h3>
   <div class="card scroll-x" style="margin-bottom:6px"><table class="t" id="permT"><tr><th>${t("task")}</th>${PROLES.map(r=>`<th style="text-align:center">${t(r)}</th>`).join("")}<th style="text-align:center">${t("admin")}</th></tr>
     ${TASKS.map(k=>`<tr><td>${esc(t("T_"+k))}</td>${PROLES.map(r=>`<td style="text-align:center"><input type="checkbox" style="width:20px;height:20px" data-pr="${r}" data-pt="${k}" ${S.perms[r+"|"+k]?"checked":""}></td>`).join("")}<td style="text-align:center"><input type="checkbox" checked disabled style="width:20px;height:20px"></td></tr>`).join("")}
   </table></div>
   <div class="muted small" style="margin:0 2px 8px">${t("accessHelp")}</div>
   <h3 style="margin:18px 0 8px;font-size:16px">${t("settings")}</h3>
   <div class="card" style="margin-bottom:10px">
     <div class="listitem"><span class="grow">${t("wasteTarget")}</span><input type="number" id="wt" step="0.1" min="0" value="${S.target}" style="width:90px"><button class="btn" id="wts">${t("save")}</button></div>
   </div>
   <div class="row" style="margin:16px 0 8px"><h3 class="grow" style="margin:0;font-size:16px">${t("machines")}</h3><button class="btn" id="addM">+ ${t("addMachine")}</button></div>
   <div class="card">${S.machines.map(mc=>`<div class="listitem"><span class="grow">${esc(mc.name)}</span><label class="check" style="margin:0"><input type="checkbox" data-mid="${mc.id}" ${mc.active?"checked":""}> ${t("activeUser")}</label></div>`).join("")}</div>`:""}
   <div class="muted small" style="text-align:center;margin:20px 0">GFB Food Sdn Bhd · ${t("appName")} v1.0</div>`;
  m.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{LANG=b.dataset.l;store.set("gfbp_lang",LANG);render();});
  $("#lo").onclick = async () => { await sb.auth.signOut({scope:"local"}); };
  $("#csv").onclick = exportCsv;
  $("#guideL").onclick = () => { S.tab = "guide"; render(); window.scrollTo(0,0); };
  $("#cpw").onclick = () => formSheet(t("changePw"), [{k:"p",label:t("newPw")+" ("+t("pwMin")+")",type:"password",req:true}], async v => {
    if(v.p.length<8) throw new Error(t("pwMin"));
    const { error } = await sb.auth.updateUser({ password: v.p }); if(error) throw error; closeSheet(); toast(t("saved"));
  });
  if(!isA) return;
  m.querySelectorAll("[data-pr]").forEach(cb => cb.onchange = async () => {
    const r = cb.dataset.pr, k = cb.dataset.pt, v = cb.checked;
    const { error } = await sb.from("role_permissions").update({ allowed: v }).eq("role", r).eq("task", k);
    if(error){ cb.checked = !v; return toast(errMsg(error), true); }
    if(v) S.perms[r+"|"+k] = true; else delete S.perms[r+"|"+k];
    toast(`${t(r)}: ${t("T_"+k)} ${v?"✓":"✗"}`);
  });
  $("#wts").onclick = async () => { const v=Number($("#wt").value); const { error } = await sb.from("app_settings").update({value:String(v)}).eq("key","wastage_target_pct"); if(error) return toast(errMsg(error),true); S.target=v; toast(t("saved")); };
  $("#addM").onclick = () => formSheet(t("addMachine"), [{k:"n",label:t("machine"),req:true}], async v => {
    const { data, error } = await sb.from("machines").insert({name:v.n.trim().toUpperCase(), sort_order:S.machines.length+1}).select().single(); if(error) throw error;
    S.machines.push(data); closeSheet(); renderMore(m); });
  m.querySelectorAll("[data-mid]").forEach(c=>c.onchange=async()=>{ const { error } = await sb.from("machines").update({active:c.checked}).eq("id",Number(c.dataset.mid)); if(error) toast(errMsg(error),true); else { S.machines.find(x=>x.id===Number(c.dataset.mid)).active=c.checked; toast(t("saved")); } });
  $("#addU").onclick = () => {
    formSheet(t("addUser"), [
      {k:"n",label:t("fullName"),req:true},
      {k:"u",label:t("username")+" (a-z, 0-9)",req:true},
      {k:"r",label:t("role"),type:"select",v:"supervisor",opts:["planner","supervisor","operation","viewer","admin"].map(r=>[r,t(r)])},
      {k:"p",label:t("password")+" ("+t("pwMin")+")",type:"text",req:true}
    ], async v => {
      const { error } = await sb.rpc("admin_create_user", { p_username:v.u, p_full_name:v.n, p_role:v.r, p_password:v.p });
      if(error) throw error; closeSheet(); toast(t("saved")); loadUsers();
    });
    const f = $("#fs"); const h = document.createElement("div"); h.className="muted small"; h.style.marginTop="8px"; h.textContent=t("userHelp"); f.insertBefore(h, $("#ferr"));
  };
  loadUsers();
}
async function loadUsers(){
  const { data, error } = await sb.from("app_users").select("*").order("full_name");
  const el = $("#ulist"); if(!el) return;
  if(error){ el.innerHTML = `<div class="listitem errbox">${esc(errMsg(error))}</div>`; return; }
  S.users = data;
  el.innerHTML = data.map(u=>`<div class="listitem" style="cursor:pointer" data-uid="${u.user_id}">
    <div class="grow"><div style="font-weight:600">${esc(u.full_name)} ${u.active?"":`<span class="badge s-CANCELLED">OFF</span>`}</div><div class="muted small">@${esc(u.username)} · ${t(u.role)}</div></div><span class="muted">›</span></div>`).join("");
  el.querySelectorAll("[data-uid]").forEach(r=>r.onclick=()=>editUser(S.users.find(u=>u.user_id===r.dataset.uid)));
}
function editUser(u){
  formSheet(`${esc(u.full_name)} · @${esc(u.username)}`, [
    {k:"n",label:t("fullName"),v:u.full_name,req:true},
    {k:"r",label:t("role"),type:"select",v:u.role,opts:["admin","planner","supervisor","operation","viewer"].map(r=>[r,t(r)])},
    {k:"a",label:t("activeUser"),type:"select",v:String(u.active),opts:[["true","✓ "+t("activeUser")],["false","✗ OFF"]]},
    {k:"p",label:t("resetPw")+" ("+t("pwMin")+")",type:"text",v:""}
  ], async v => {
    const { error } = await sb.from("app_users").update({ full_name:v.n.trim(), role:v.r, active:v.a==="true" }).eq("user_id", u.user_id);
    if(error) throw error;
    if(v.p){ const r = await sb.rpc("admin_reset_password", { p_user:u.user_id, p_password:v.p }); if(r.error) throw r.error; }
    closeSheet(); toast(t("saved")); loadUsers();
  });
}
function exportCsv(subset){
  const src = Array.isArray(subset) ? subset : S.jobs;
  const cols = ["job_no","machine","plan_date","item_code","product","customer","batch_qty","batches","total_planned","jo_mix","jo_pack","bulk_packing","status","date_released","date_mixing","date_done","mixing_output","batch_detail","date_packing","pack_qty","pack_uom","pack_unit_kg","packing_output","variance_kg","date_qc","qc_result","to_req_no","date_transferred","date_closed","notes","remarks","wastage_cause","wastage_action","wastage_verified_by","wastage_verified_date"];
  const rows = [...src].sort((a,b)=>a.id-b.id).map(j=>cols.map(c=>{ let v = c==="batch_detail" ? batchesOf(j.id).map(b=>`${b.jo_no}:${b.mix_kg??""}`).join(" ") : c==="jo_mix"||c==="jo_pack" ? (j[c]||[]).map(JO) : j[c]; if(Array.isArray(v)) v=v.join(" "); if(v==null) v=""; v=String(v); return /[",\n]/.test(v)?`"${v.replace(/"/g,'""')}"`:v; }).join(","));
  const blob = new Blob(["﻿"+cols.join(",")+"\n"+rows.join("\n")], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `GFB_Production_${today()}.csv`; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}

window.addEventListener("online", ()=>{ if(S.me){ loadAll().then(()=>{subscribe(); render();}); } });
boot();
